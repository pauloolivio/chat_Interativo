<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sala de Aula - Chat Interativo</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Tela de Login */
        .login-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
            overflow-y: auto;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .login-box::-webkit-scrollbar {
            width: 6px;
        }

        .login-box::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .login-box::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header i {
            font-size: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }

        .login-header h2 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .login-header p {
            color: #6b7280;
            font-size: 12px;
        }

        .role-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            font-weight: 500;
        }

        .role-btn i {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
        }

        .role-btn.active {
            border-color: #667eea;
            background: #f0f4ff;
            color: #667eea;
        }

        .role-btn.professor.active {
            border-color: #ec489a;
            background: #fdf2f8;
            color: #ec489a;
        }

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #374151;
            font-weight: 500;
            font-size: 12px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 13px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .google-btn {
            background: white;
            color: #333;
            border: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: #f8f9fa;
        }

        .google-btn i {
            font-size: 16px;
            color: #ea4335;
        }

        .divider {
            text-align: center;
            margin: 15px 0;
            position: relative;
        }

        .divider::before,
        .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 44%;
            height: 1px;
            background: #e5e7eb;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #9ca3af;
            font-size: 11px;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            text-align: center;
        }

        /* Chat Layout */
        .chat-layout {
            display: none;
            height: 100%;
            width: 100%;
            flex-direction: row;
        }

        .chat-layout.active {
            display: flex;
        }

        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #ffffff;
        }

        .sidebar {
            width: 260px;
            background: #f9fafb;
            border-left: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .sidebar-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }

        .sidebar-header h3 {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .sidebar-header p {
            font-size: 11px;
            opacity: 0.9;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .user-item {
            background: white;
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-right: 3px solid #10b981;
            transition: all 0.2s;
            position: relative;
        }

        .user-item:hover {
            transform: translateX(-4px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .user-item i {
            font-size: 18px;
            color: #667eea;
        }

        .user-item .user-info {
            flex: 1;
        }

        .user-item .user-name {
            font-weight: 600;
            color: #1f2937;
            font-size: 12px;
        }

        .user-item .user-role {
            font-size: 10px;
            color: #9ca3af;
        }

        .online-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .offline-dot {
            width: 7px;
            height: 7px;
            background: #9ca3af;
            border-radius: 50%;
        }

        .remove-user-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #ef4444;
            font-size: 12px;
            padding: 4px;
            border-radius: 6px;
            transition: all 0.2s;
            opacity: 0;
        }

        .user-item:hover .remove-user-btn {
            opacity: 1;
        }

        .remove-user-btn:hover {
            background: #fee;
            transform: scale(1.1);
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .chat-header {
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .user-info-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        .user-name-header {
            font-size: 14px;
            font-weight: 600;
            color: #1f2937;
        }

        .user-badge {
            background: #10b981;
            padding: 3px 10px;
            border-radius: 16px;
            font-size: 11px;
            color: white;
            font-weight: 500;
        }

        .admin-buttons {
            display: flex;
            gap: 6px;
        }

        .admin-btn {
            background: #f3f4f6;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #6b7280;
            font-size: 11px;
            font-weight: 500;
            border: none;
            transition: all 0.3s;
        }

        .admin-btn:hover {
            background: #e5e7eb;
        }

        .admin-btn.save:hover {
            background: #10b981;
            color: white;
        }

        .admin-btn.clear:hover {
            background: #ef4444;
            color: white;
        }

        .admin-btn.clean-users:hover {
            background: #f59e0b;
            color: white;
        }

        .logout-btn {
            background: #f3f4f6;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            color: #6b7280;
            font-size: 12px;
            font-weight: 500;
            border: none;
        }

        .logout-btn:hover {
            background: #fee;
            color: #ef4444;
        }

        .menu-toggle {
            display: none;
            background: #f3f4f6;
            border: none;
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            font-size: 16px;
            color: #4b5563;
            transition: all 0.3s;
        }

        .menu-toggle:hover {
            background: #e5e7eb;
        }

        .online-status {
            font-size: 11px;
            color: #10b981;
            margin-top: 2px;
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Mensagem */
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            word-wrap: break-word;
            animation: slideIn 0.3s ease;
            position: relative;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-student {
            background: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #e5e7eb;
        }

        .message-professor {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: white;
        }

        .message-header {
            font-size: 11px;
            margin-bottom: 5px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .message-professor .message-header {
            color: rgba(255,255,255,0.8);
        }

        .message-student .message-header {
            color: #9ca3af;
        }

        .message-content {
            margin-bottom: 5px;
            font-size: 13px;
        }

        .message-time {
            font-size: 9px;
        }

        .message-professor .message-time {
            color: rgba(255,255,255,0.6);
        }

        .message-student .message-time {
            color: #9ca3af;
        }

        .message-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 6px;
            padding-top: 3px;
        }

        .copy-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 10px;
            padding: 3px 6px;
            border-radius: 10px;
            transition: all 0.2s;
            color: #9ca3af;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            opacity: 0.6;
        }

        .message:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: rgba(0,0,0,0.05);
            color: #667eea;
            opacity: 1;
        }

        .message-professor .copy-btn {
            color: rgba(255,255,255,0.6);
        }

        .message-professor .copy-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
            opacity: 1;
        }

        .copy-success {
            color: #10b981 !important;
        }

        .message-professor .copy-success {
            color: #a7f3d0 !important;
        }

        .code-block {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            overflow-x: auto;
            margin: 6px 0;
            font-size: 11px;
            position: relative;
        }

        /* Input Area */
        .input-area {
            padding: 12px 20px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-input-wrapper {
            background: #f9fafb;
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #e5e7eb;
            transition: all 0.3s;
            width: 100%;
        }

        .message-input-wrapper:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            width: 100%;
            border: none;
            background: transparent;
            padding: 0;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.4;
            min-height: 70px;
            height: 70px;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            justify-content: space-between;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 400;
            transition: all 0.3s;
        }

        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            width: 100%;
            font-size: 13px;
            font-weight: 400;
        }

        .btn-send:hover {
            transform: translateY(-2px);
        }

        .btn-emoji {
            background: #f3f4f6;
            color: #4b5563;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 10px;
            flex: 1;
        }

        .btn-emoji:hover {
            background: #e5e7eb;
        }

        .emoji-picker {
            position: absolute;
            bottom: 160px;
            right: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 10px;
            display: none;
            z-index: 1000;
            border: 1px solid #e5e7eb;
        }

        .emoji-picker.active {
            display: block;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 5px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px;
        }

        .emoji-grid span {
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            text-align: center;
            transition: all 0.2s;
            border-radius: 8px;
        }

        .emoji-grid span:hover {
            background: #f3f4f6;
            transform: scale(1.1);
        }

        .emoji-grid::-webkit-scrollbar {
            width: 6px;
        }

        .emoji-grid::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .emoji-grid::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 10px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: #333;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 2000;
            animation: fadeInOut 2s ease;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                right: -260px;
                top: 0;
                height: 100%;
                z-index: 1000;
                transition: right 0.3s ease;
                border-left: none;
                box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            }

            .sidebar.open {
                right: 0;
            }

            .menu-toggle {
                display: inline-block;
            }

            .message {
                max-width: 90%;
            }

            .login-box {
                padding: 25px 20px;
            }

            .role-buttons {
                flex-direction: column;
                gap: 8px;
            }

            .chat-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-buttons {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .emoji-picker {
                right: 10px;
                bottom: 160px;
            }

            .emoji-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        @media (max-width: 480px) {
            .input-area {
                padding: 10px 16px;
            }
            
            textarea {
                min-height: 60px;
                height: 60px;
                font-size: 12px;
            }
            
            .btn-send {
                padding: 8px 16px;
                font-size: 12px;
            }
            
            .btn-emoji {
                padding: 6px 12px;
                font-size: 14px;
            }
            
            .message {
                max-width: 95%;
                padding: 8px 12px;
            }
            
            .message-content {
                font-size: 12px;
            }
            
            .chat-header {
                padding: 10px 16px;
            }
            
            .messages-area {
                padding: 12px;
            }
            
            .avatar {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
            
            .user-name-header {
                font-size: 13px;
            }
            
            .admin-btn, .logout-btn {
                padding: 5px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="login-container" id="loginContainer">
            <div class="login-box">
                <div class="login-header">
                    <i class="fas fa-graduation-cap"></i>
                    <h2>Sala de Aula Interativa</h2>
                    <p>Chat interativo para aulas colaborativas</p>
                </div>

                <div class="role-buttons">
                    <div class="role-btn professor" onclick="selectRole('professor')">
                        <i class="fas fa-chalkboard-user"></i>
                        Professor
                    </div>
                    <div class="role-btn student" onclick="selectRole('student')">
                        <i class="fas fa-user-graduate"></i>
                        Aluno
                    </div>
                </div>

                <div class="login-form" id="professorForm">
                    <div class="form-group">
                        <label>Email do Professor</label>
                        <input type="email" id="professorEmail" placeholder="professor@escola.com">
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="professorPassword" placeholder="••••••">
                    </div>
                    <button class="login-btn" onclick="loginProfessorEmail()">
                        <i class="fas fa-envelope"></i> Entrar com Email
                    </button>
                    
                    <div class="divider"><span>ou</span></div>
                    
                    <button class="login-btn google-btn" onclick="loginProfessorGoogle()">
                        <i class="fab fa-google"></i> Entrar com Google
                    </button>
                </div>

                <div class="login-form" id="studentForm">
                    <div class="form-group">
                        <label>Seu Nome</label>
                        <input type="text" id="studentName" placeholder="Digite seu nome ou apelido">
                    </div>
                    <button class="login-btn" onclick="loginStudent()">
                        <i class="fas fa-door-open"></i> Entrar na Sala
                    </button>
                </div>
            </div>
        </div>

        <div class="chat-layout" id="chatLayout">
            <div class="chat-main">
                <div class="chat-header">
                    <div class="user-info-header">
                        <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">
                            <i class="fas fa-bars"></i>
                        </button>
                        <div class="avatar" id="userAvatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <div class="user-name-header" id="userNameDisplay">Carregando...</div>
                            <div class="online-status" id="onlineStatus">
                                <i class="fas fa-circle"></i> Conectado
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                        <span class="user-badge" id="userRoleBadge"></span>
                        <div class="admin-buttons" id="adminButtons" style="display: none;">
                            <button class="admin-btn save" onclick="exportChatJSON()">
                                <i class="fas fa-download"></i> Salvar
                            </button>
                            <button class="admin-btn clean-users" onclick="cleanOfflineUsers()">
                                <i class="fas fa-broom"></i> Limpar Offline
                            </button>
                            <button class="admin-btn clear" onclick="confirmClearChat()">
                                <i class="fas fa-trash-alt"></i> Limpar Chat

        let currentUser = { name: '', role: '', id: '', email: '', uid: '' };

        // ==================== PERSISTÊNCIA DE LOGIN ====================
        function saveUserToLocalStorage(user) {
            if (user && user.role === 'student') {
                localStorage.setItem('deepseek_user', JSON.stringify({
                    name: user.name,
                    role: user.role,
                    id: user.id,
                    timestamp: Date.now()
                }));
            }
        }

        function loadUserFromLocalStorage() {
            const savedUser = localStorage.getItem('deepseek_user');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    // Verificar se o login não expirou (24 horas)
                    if (user && user.role === 'student' && (Date.now() - user.timestamp) < 86400000) {
                        return {
                            name: user.name,
                            role: 'student',
                            id: user.id,
                            email: '',
                            uid: ''
                        };
                    } else {
                        localStorage.removeItem('deepseek_user');
                    }
                } catch (e) {
                    localStorage.removeItem('deepseek_user');
                }
            }
            return null;
        }

        function clearUserFromLocalStorage() {

        async function loginProfessorEmail() {
            const email = document.getElementById('professorEmail').value.trim();
            const password = document.getElementById('professorPassword').value;
            
            if (!email || !password) {
                showError('Preencha todos os campos!');
                return;

            try {
                const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                if (PROFESSORES_AUTORIZADOS.includes(user.email)) {
                    currentUser = {
                        name: user.displayName || user.email.split('@')[0],
                        role: 'professor',
                        id: 'prof_' + user.uid,

                        uid: user.uid
                    };
                    enterChat();

                    await firebase.auth().signOut();
                    showError('Acesso negado. Email não autorizado.');

            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await firebase.auth().signInWithPopup(provider);
                const user = result.user;
                
                if (PROFESSORES_AUTORIZADOS.includes(user.email)) {
                    currentUser = {
                        name: user.displayName || user.email.split('@')[0],
                        role: 'professor',
                        id: 'prof_' + user.uid,
                        email: user.email,
                        uid: user.uid

                    enterChat();

                    await firebase.auth().signOut();
                    showError('Acesso negado. Email não autorizado.');
                }
            } catch (error) {
                showError('Erro no login: ' + error.message);
            }
        }

        function loginStudent() {
            const name = document.getElementById('studentName').value.trim();

                showError('Digite um nome válido!');

            currentUser = {

                email: '',
                uid: ''

            // Salvar no localStorage

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            const loginBox = document.querySelector('.login-box');
            const existing = loginBox.querySelector('.error-message');
            if (existing) existing.remove();
            loginBox.insertBefore(errorDiv, loginBox.children[1]);
            setTimeout(() => errorDiv.remove(), 3000);
        }

        firebase.auth().onAuthStateChanged(async (user) => {
            if (user && !currentUser.id) {
                if (PROFESSORES_AUTORIZADOS.includes(user.email)) {
                    currentUser = {
                        name: user.displayName || user.email.split('@')[0],
                        role: 'professor',
                        id: 'prof_' + user.uid,
                        email: user.email,
                        uid: user.uid
                    };
                    enterChat();
                }
            }
        });

        // Tentar reconectar aluno ao carregar a página
        function tryAutoLogin() {
            const savedUser = loadUserFromLocalStorage();
            if (savedUser) {
                currentUser = savedUser;
                enterChat();
                return true;
            }
            return false;
        }

        function enterChat() {
            if (!currentUser.id) {
                if (currentRole === 'student') {
                    const studentNameInput = document.getElementById('studentName');
                    const name = studentNameInput.value.trim();
                    if (!name) {
                        showError('Por favor, digite seu nome.');
                        return;
                    }
                    currentUser = {
                        name: name,
                        role: 'student',
                        id: 'std_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                        email: '',
                        uid: ''
                    };
                    saveUserToLocalStorage(currentUser);
                } else {
                    showError('Professores devem fazer login com Google ou Email.');
                    return;
                }
            }

            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('chatLayout').classList.add('active');

            const avatar = document.getElementById('userAvatar');
            avatar.innerHTML = `<i class="fas fa-${currentUser.role === 'professor' ? 'chalkboard-user' : 'user-graduate'}"></i>`;
            
            document.getElementById('userNameDisplay').innerHTML = currentUser.name;
            if (currentUser.role === 'professor') {
                document.getElementById('userRoleBadge').innerHTML = 'Professor';
                document.getElementById('userRoleBadge').style.background = '#ec489a';
                document.getElementById('adminButtons').style.display = 'flex';
            } else {
                document.getElementById('userRoleBadge').innerHTML = 'Aluno';
                document.getElementById('userRoleBadge').style.background = '#10b981';
                document.getElementById('adminButtons').style.display = 'none';
            }

            const userRef = firebase.database().ref('users/' + currentUser.id);
            userRef.set({
                name: currentUser.name,
                role: currentUser.role,
                email: currentUser.email,
                uid: currentUser.uid,
                online: true,
                lastSeen: firebase.database.ServerValue.TIMESTAMP,
                timestamp: Date.now()
            });

            if (heartbeatInterval) clearInterval(heartbeatInterval);
            heartbeatInterval = setInterval(() => {
                if (currentUser && currentUser.id) {
                    firebase.database().ref('users/' + currentUser.id).update({
                        lastSeen: firebase.database.ServerValue.TIMESTAMP,
                        online: true
                    }).catch(err => console.error('Heartbeat error:', err));
                }
            }, 15000);

            const connectedRef = firebase.database().ref('.info/connected');
            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    const userStatusRef = firebase.database().ref('users/' + currentUser.id);
                    userStatusRef.onDisconnect().update({
                        online: false,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            });

            loadMessages();
            loadOnlineUsers();
            renderEmojis();

        function loadOnlineUsers() {
            firebase.database().ref('users').on('value', (snapshot) => {
                const users = snapshot.val();
                const usersList = document.getElementById('usersList');
                usersList.innerHTML = '';
                usersData = users || {};
                
                if (users) {
                    const now = Date.now();
                    const userArray = Object.entries(users).map(([id, user]) => ({ id, ...user }));
                    
                    userArray.sort((a, b) => {
                        if (a.online === b.online) return 0;
                        return a.online ? -1 : 1;
                    });
                    
                    const onlineCount = userArray.filter(u => u.online === true).length;
                    document.getElementById('onlineStatus').innerHTML = `<i class="fas fa-circle"></i> ${onlineCount} online`;
                    
                    if (userArray.length === 0) {
                        usersList.innerHTML = '<div style="text-align:center;color:#999;padding:20px;font-size:12px;">Nenhum usuário na sala</div>';
                    } else {
                        userArray.forEach(user => {
                            const userDiv = document.createElement('div');
                            userDiv.className = 'user-item';
                            const isOnline = user.online === true;
                            
                            userDiv.innerHTML = `
                                <i class="fas fa-${user.role === 'professor' ? 'chalkboard-user' : 'user-graduate'}"></i>
                                <div class="user-info">
                                    <div class="user-name">${escapeHtml(user.name)}</div>
                                    <div class="user-role">${user.role === 'professor' ? 'Professor' : 'Aluno'}</div>
                                </div>
                                <div class="${isOnline ? 'online-dot' : 'offline-dot'}"></div>
                                ${currentUser.role === 'professor' && user.role !== 'professor' ? `<button class="remove-user-btn" onclick="removeUser('${user.id}')" title="Remover usuário"><i class="fas fa-times-circle"></i></button>` : ''}
                            `;
                            usersList.appendChild(userDiv);
                        });
                    }
                } else {
                    usersList.innerHTML = '<div style="text-align:center;color:#999;padding:20px;font-size:12px;">Nenhum usuário na sala</div>';
                }
            });
        }

        function removeUser(userId) {
            if (confirm('Tem certeza que deseja remover este usuário da lista?')) {
                firebase.database().ref('users/' + userId).remove()
                    .then(() => {
                        showToast('Usuário removido com sucesso!');
                    })
                    .catch(err => {
                        console.error('Erro ao remover usuário:', err);
                        alert('Erro ao remover usuário.');
                    });
            }
        }

        function cleanOfflineUsers() {
            if (!usersData) return;
            
            const offlineUsers = Object.entries(usersData).filter(([id, user]) => user.online === false);
            
            if (offlineUsers.length === 0) {
                alert('Não há usuários offline para remover.');
                return;
            }
            
            if (confirm(`Deseja remover ${offlineUsers.length} usuário(s) offline da lista?`)) {
                let removed = 0;
                offlineUsers.forEach(([id]) => {
                    firebase.database().ref('users/' + id).remove()
                        .then(() => removed++)
                        .catch(err => console.error('Erro ao remover:', err));
                });
                setTimeout(() => {
                    showToast(`${removed} usuário(s) removido(s) com sucesso!`);
                }, 1000);
            }
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const text = messageInput.value.trim();
            
            if (!text) return;
            
            const message = {
                id: Date.now(),
                userId: currentUser.id,
                userName: currentUser.name,
                userRole: currentUser.role,
                text: text,
                timestamp: Date.now()
            };
            
            try {
                await firebase.database().ref('messages/' + message.id).set(message);
                messageInput.value = '';
                messageInput.style.height = '70px';
            } catch (error) {
                console.error("Erro ao enviar mensagem:", error);
                alert("Erro ao enviar: " + error.message);
            }
        }
        
        function copyToClipboard(buttonElement) {
            const text = buttonElement.getAttribute('data-text');
            const cleanText = text.replace(/\\n/g, '\n').replace(/\\\\/g, '\\');
            
            navigator.clipboard.writeText(cleanText).then(() => {
                const originalHTML = buttonElement.innerHTML;
                buttonElement.innerHTML = '<i class="fas fa-check"></i> Copiado!';
                buttonElement.classList.add('copy-success');
                setTimeout(() => {
                    buttonElement.innerHTML = originalHTML;
                    buttonElement.classList.remove('copy-success');
                }, 2000);
            }).catch(err => {
                console.error('Erro ao copiar:', err);
                const textarea = document.createElement('textarea');
                textarea.value = cleanText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                const originalHTML = buttonElement.innerHTML;
                buttonElement.innerHTML = '<i class="fas fa-check"></i> Copiado!';
                buttonElement.classList.add('copy-success');
                setTimeout(() => {
                    buttonElement.innerHTML = originalHTML;
                    buttonElement.classList.remove('copy-success');
                }, 2000);
            });
        }
        
        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.classList.toggle('active');
            
            if (picker.classList.contains('active')) {
                renderEmojis();
                setTimeout(() => {
                    document.addEventListener('click', function closePicker(e) {
                        if (!picker.contains(e.target) && !e.target.closest('.btn-emoji')) {
                            picker.classList.remove('active');
                            document.removeEventListener('click', closePicker);
                        }
                    });
                }, 0);
            }
        }
        
        function addEmoji(emoji) {
            const messageInput = document.getElementById('messageInput');
            const start = messageInput.selectionStart;
            const end = messageInput.selectionEnd;
            const text = messageInput.value;
            const newText = text.substring(0, start) + emoji + text.substring(end);
            messageInput.value = newText;
            messageInput.focus();
            messageInput.selectionStart = messageInput.selectionEnd = start + emoji.length;
            messageInput.dispatchEvent(new Event('input'));
        }
        
        function loadMessages() {
            firebase.database().ref('messages').orderByChild('timestamp').on('child_added', (snapshot) => {
                const message = snapshot.val();
                if (!allMessages.some(m => m.id === message.id)) {
                    allMessages.push(message);
                }
                renderMessage(message);
                scrollToBottom();
            });
        }
        
        function renderMessage(message) {
            const messagesArea = document.getElementById('messagesArea');
            if (document.getElementById(`msg_${message.id}`)) return;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.userRole === 'professor' ? 'message-professor' : 'message-student'}`;
            messageDiv.id = `msg_${message.id}`;
            
            let content = `<div class="message-header">
                            <span><strong>${escapeHtml(message.userName)}</strong> ${message.userRole === 'professor' ? '👨‍🏫' : '👨‍🎓'}</span>
                            <span class="message-time">${new Date(message.timestamp).toLocaleTimeString()}</span>
                           </div>`;
            
            content += `<div class="message-content">`;
            
            const messageText = message.text || '';
            if (messageText) {
                if (messageText.includes('function') || messageText.includes('class') || messageText.includes('def ') || messageText.includes('```')) {
                    content += `<pre class="code-block">${escapeHtml(messageText)}</pre>`;
                } else {
                    let formattedText = escapeHtml(messageText).replace(/\n/g, '<br>');
                    formattedText = formattedText.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: inherit; text-decoration: underline;">$1</a>');
                    content += `<p>${formattedText}</p>`;
                }
            }
            
            content += `</div>`;
            
            const safeText = messageText.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/"/g, '&quot;');
            content += `<div class="message-footer">
                            <button class="copy-btn" data-text="${safeText}" onclick="copyToClipboard(this)">
                                <i class="far fa-copy"></i> Copiar
                            </button>
                        </div>`;
            
            messageDiv.innerHTML = content;
            messagesArea.appendChild(messageDiv);
        }
        
        function scrollToBottom() {
            const messagesArea = document.getElementById('messagesArea');
            setTimeout(() => {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 100);
        }
        
        async function exportChatJSON() {
            try {
                const snapshot = await firebase.database().ref('messages').once('value');
                const messages = snapshot.val();
                
                if (!messages) {
                    alert('Nenhuma mensagem para exportar!');
                    return;
                }
                
                const messagesArray = Object.values(messages).sort((a, b) => a.timestamp - b.timestamp);
                const exportData = {
                    exportDate: new Date().toISOString(),
                    totalMessages: messagesArray.length,
                    messages: messagesArray
                };
                
                const jsonStr = JSON.stringify(exportData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `chat_export_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alert(`✅ Chat exportado com sucesso!\nTotal: ${messagesArray.length} mensagens`);
            } catch (error) {
                console.error('Erro ao exportar:', error);
                alert('Erro ao exportar chat: ' + error.message);
            }
        }
        
        function confirmClearChat() {
            if (confirm('⚠️ ATENÇÃO: Isso irá apagar TODAS as mensagens permanentemente. Continuar?')) {
                clearChat();
            }
        }
        
        async function clearChat() {
            try {
                const snapshot = await firebase.database().ref('messages').once('value');
                const messages = snapshot.val();
                
                if (!messages) {
                    alert('Nenhuma mensagem para apagar.');
                    return;
                }
                
                const messageIds = Object.keys(messages);
                let deletedCount = 0;
                
                for (const id of messageIds) {
                    await firebase.database().ref('messages/' + id).remove();
                    deletedCount++;
                }
                
                allMessages = [];
                document.getElementById('messagesArea').innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 30px;"><i class="fas fa-comments" style="font-size: 40px; margin-bottom: 12px; display: block;"></i><span style="font-size: 13px;">Chat limpo! Novo início.</span></div>';
                
                alert(`✅ ${deletedCount} mensagens foram removidas com sucesso!`);
                
                firebase.database().ref('messages').off();
                loadMessages();
                
            } catch (error) {
                console.error('Erro ao limpar chat:', error);
                alert('Erro ao limpar mensagens: ' + error.message);
            }
        }
        
        async function logout() {
            try {
                if (heartbeatInterval) {
                    clearInterval(heartbeatInterval);
                    heartbeatInterval = null;
                }
                
                if (currentUser && currentUser.id) {
                    await firebase.database().ref('users/' + currentUser.id).update({ 
                        online: false,
                        lastSeen: Date.now()
                    });
                }
                
                // Limpar localStorage apenas para alunos
                if (currentUser.role === 'student') {
                    clearUserFromLocalStorage();
                }
                
                if (currentUser.role === 'professor') {
                    await firebase.auth().signOut();
                }
                
                currentUser = { name: '', role: '', id: '', email: '', uid: '' };
                allMessages = [];
                
                firebase.database().ref('messages').off();
                firebase.database().ref('users').off();
                
                document.getElementById('loginContainer').style.display = 'flex';
                document.getElementById('chatLayout').classList.remove('active');
                
                document.getElementById('professorEmail').value = '';
                document.getElementById('professorPassword').value = '';
                document.getElementById('studentName').value = '';
                document.getElementById('messageInput').value = '';
                
                const messagesArea = document.getElementById('messagesArea');
                messagesArea.innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 30px;"><i class="fas fa-comments" style="font-size: 40px; margin-bottom: 12px; display: block;"></i><span style="font-size: 13px;">Bem-vindo à sala de aula!</span></div>';
                
                const usersList = document.getElementById('usersList');
                usersList.innerHTML = '<div style="text-align: center; color: #999; padding: 20px; font-size: 12px;"><i class="fas fa-spinner fa-spin"></i><br>Carregando...</div>';
                
                selectRole('student');
            } catch (error) {
                console.error('Erro no logout:', error);
                document.getElementById('loginContainer').style.display = 'flex';
                document.getElementById('chatLayout').classList.remove('active');
                selectRole('student');
            }
        }

            sidebar.classList.toggle('open');
        }
        
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const menuToggle = document.getElementById('menuToggle');
            if (window.innerWidth <= 768) {
                if (sidebar && sidebar.classList.contains('open')) {
                    if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                        sidebar.classList.remove('open');
                    }
                }
            }
        });
        
        const messageInput = document.getElementById('messageInput');
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            if (this.scrollHeight > 70) {
                this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            } else {
                this.style.height = '70px';
            }
        });
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        document.addEventListener('click', (e) => {
            const picker = document.getElementById('emojiPicker');
            const emojiBtn = document.querySelector('.btn-emoji');
            if (picker && emojiBtn) {
                if (!picker.contains(e.target) && !emojiBtn.contains(e.target)) {
                    picker.classList.remove('active');
                }
            }
        });
        
        // Inicialização: tentar auto-login do aluno
        if (!tryAutoLogin()) {
            selectRole('student');
        }
    </script>
</body>
</html>
